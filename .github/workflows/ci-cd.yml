name: CI/CD

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ci-cd:
    name: CI/CD
    uses: StudioLE/Actions/.github/workflows/ci-cd-rust.yml@v8
    with:
      package_name: mount-luks
      binary_name: mount-luks
      matrix: |
        [
          {
            "target": "x86_64-unknown-linux-gnu",
            "os": "ubuntu-24.04",
            "test": true
          },
          {
            "target": "x86_64-unknown-linux-musl",
            "os": "ubuntu-24.04"
          },
          {
            "target": "aarch64-unknown-linux-gnu",
            "os": "ubuntu-24.04-arm"
          },
          {
            "target": "aarch64-unknown-linux-musl",
            "os": "ubuntu-24.04-arm"
          }
        ]
      brew_repo: StudioLE/homebrew-tap
      brew_formula_file: .github/brew/formula.template.rb
    secrets:
      cargo_registry_token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      brew_repo_token: ${{ secrets.BREW_REPO_TOKEN }}
